<html layout:decorate="~{/auth/layout}">
<body>
  <div layout:fragment="content">
    <div class="card shadow-lg p-4 p-md-5">
      <!-- Logo Superior -->
      <div class="text-center mb-4">
        <div class="logo-container">
          <i class="bi bi-shield-lock-fill"></i>
        </div>
        <h3 class="fw-bold text-dark m-0">Welcome</h3>
      </div>

      <!-- Formulario -->
      <form th:action="@{/auth/login}" method="POST">
        
        <!-- Campo Usuario / Email -->
        <div class="mb-3">
          <label for="username" class="form-label text-secondary fw-semibold small">
            Email
          </label>
          <div class="input-group">
            <input
              name="username"
              type="text"
              class="form-control" id="username" placeholder="Email" required>
          </div>
        </div>

        <!-- Campo Contraseña -->
        <div class="mb-3">
          <label for="password" class="form-label text-secondary fw-semibold small">
            Password
          </label>
          <input
            name="password"
            type="password" class="form-control" id="password" placeholder="••••••••" required>
        </div>

        <!-- Recuérdame y Olvidé Contraseña -->
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="rememberMe">
            <label class="form-check-label text-secondary small" for="rememberMe">
              Recuérdame
            </label>
          </div>
          <a th:href="@{/auth/recovery}"
            class="text-primary-custom small">
            Forgot your password ?
          </a>
        </div>

        <!-- Botón de Inicio de Sesión -->
        <div class="d-grid gap-2">
          <button type="submit" class="btn btn-primary">Login</button>
        </div>

      </form>

      <!-- Crear Nueva Cuenta -->
      <div class="text-center">
        <p class="text-secondary small mb-0"> Don't have an account ?
          <a th:href="@{/auth/register}" class="text-primary-custom fw-semibold">
            Create a new account
          </a>
        </p>
      </div>

    </div>

  </div>
</body>
</html>
