<html layout:decorate="~{layout/cruds}">
    <head>
    </head>
    <body>
        <div layout:fragment="content">
        <!-- START -->

          <!-- Link to back -->
          <a th:href="@{/products/menu/{menuId}(menuId=${menuId})}"
            class="text-decoration-none text-muted">
            <i class="bi bi-arrow-left me-1"></i> Back to products
          </a>

          <!-- Data -->
          <div class="panel mt-3 mb-4">
            <div class="d-flex flex-wrap justify-content-between align-items-start gap-3">
              <div>
                <h1 class="h3 fw-bold mb-1" th:text="${product.name}">
                </h1>
                <p class="text-muted mb-2" th:text="${product.description}">
                </p>
              </div>
              <div class="d-flex flex-wrap gap-2">
                <a class="btn btn-primary"
                  th:href="@{/products/new/{id}(id=${menuId})}">
                  <i class="bi bi-collection me-1"></i>
                  New Product
                </a>
              </div>
            </div>
          </div>
        <!-- END -->
        </div>
    </body>
</html>
