<html layout:decorate="~{layout/main}">
    <head>
    </head>
    <body>
        <div layout:fragment="content">

          <!-- START -->
          <div class="row justify-content-center">
            <div class="col-12 col-lg-8 col-xl-6">
              <div class="mb-4">
                <a href="/menus" class="text-decoration-none text-muted">
                  <i class="bi bi-arrow-left me-1"></i> Back to products
                </a>
                <h1 class="h3 fw-bold mt-2">Edit product</h1>
                <p class="text-muted mb-0">
                  Complete the data to edit the products.
                </p>
              </div>

              <div class="form-container">
                <form novalidate
                    th:object="${editProductRq}"
                    th:action="@{/products/update/{menuId}/{id}(menuId=${menuId},id=${id})}"
                    method="post"
                    enctype="multipart/form-data">
                  <div class="mb-3">
                    <label class="form-label">
                      Name
                    </label>
                    <input
                      type="text"
                      class="form-control"
                      required
                      maxlength="100"
                      th:field="*{name}">
                  </div>
                  <div class="mb-3">
                    <label class="form-label">
                      Description
                    </label>
                    <input
                      type="text"
                      class="form-control"
                      required
                      maxlength="100"
                      th:field="*{description}">
                  </div>
                  <div class="mb-3">
                    <label class="form-label">
                      Section
                    </label>
                    <select class="form-select"
                        th:field="*{sectionId}">
                        <option value="">Select</option>
                        <option 
                            th:each="section : ${sections}"
                            th:value="${section.id}"
                            th:text="${section.name}">
                        </option>
                    </select>
                  </div>
                  <div class="mb-3">
                    <label class="form-label">
                      Price
                    </label>
                    <input
                      type="number"
                      class="form-control"
                      required
                      th:field="*{price}">
                  </div>
                  <input type="hidden" th:field="*{menuId}">
                  <div class="d-flex flex-wrap gap-2 justify-content-end">
                    <a th:href="@{/menus}" class="btn btn-secondary">
                        Cancel
                    </a>
                    <button type="submit" class="btn btn-primary">
                      <i class="bi bi-plus-lg me-1"></i> Save
                    </button>
                  </div>
                </form>
              </div>
            </div>
          </div>
          <!-- END -->

        </div>
    </body>
</html>
