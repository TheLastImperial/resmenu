spring:
  application:
    name: resmenu
  datasource:
    url: jdbc:postgresql://localhost:5432/resmenu
    username: resmenu
    password: 12345678
  jpa:
    hibernate:
      ddl-auto: update
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
management:
  metrics:
    tags:
      application: ${spring.application.name}
      namespace: develop
      instance: ${spring.application.name}:${spring.application.instance_id:${random.value}}
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

com:
  thelastimperial:
    resmenu:
      security:
        publicKey: 
        privateKey: 
        keyid: 4ebb6cf4-9bb3-49ba-9acb-5fb6354472ec
      storage:
        path: PATH_STORAGE
        media-types: image/jpeg, image/png
