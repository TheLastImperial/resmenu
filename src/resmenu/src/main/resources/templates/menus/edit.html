<html layout:decorate="~{layout/main}">
    <head>
    </head>
    <body>
        <div layout:fragment="content">

            <form action="#"
                th:action="@{../update/{id}(id=${menu.id})}"
                th:object="${menu}"
                method="post">
                <div>
                    <label for="name" class="form-label">Name</label>
                    <input type="text" th:field="*{name}" name="name" class="form-control">
                </div>
                <div>
                    <label for="address" class="form-label">Address</label>
                    <input type="text" th:field="*{address}" name="address" class="form-control">
                </div>
                <div>
                    <label for="phone" class="form-label">Phone</label>
                    <input type="text" th:field="*{phone}" name="phone" class="form-control">
                </div>
                <div>
                    <label for="active" class="form-check-label">Active</label>
                    <input type="checkbox" td:field="*{active}" class="form-check-inpu">
                </div>
                <div>
                    <button type="submit" class="btn btn-primary">
                        Save
                    </button>
                </div>
            </form>

        </div>
    </body>
</html>
