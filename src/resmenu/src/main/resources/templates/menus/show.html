<html layout:decorate="~{layout/main}">
    <head>
      <style>
    .panel { background:#fff; border-radius:1rem; box-shadow:0 4px 12px rgba(0,0,0,.05); padding:1.5rem; }
    .section-card { border:0; border-radius:1rem; box-shadow:0 4px 12px rgba(0,0,0,.05); }
    .section-card .card-header { background:#fff; border-bottom:1px solid #eee; border-radius:1rem 1rem 0 0; }
      </style>
    </head>
    <body>
        <div layout:fragment="content">

          <a href="/menus" class="text-decoration-none text-muted">
            <i class="bi bi-arrow-left me-1"></i> Volver a menús
          </a>

          <div class="panel mt-3 mb-4">
            <div class="d-flex flex-wrap justify-content-between align-items-start gap-3">
              <div>
                <h1 class="h3 fw-bold mb-1" id="menuName" th:text="${menu.name}">
                </h1>
                <p class="text-muted mb-2" th:text="${menu.description}">
                </p>
                <span class="badge text-bg-success"
                  th:classappend="${menu.active} ? 'text-bg-success' : 'text-bg-danger'"
                  th:text="${menu.active} ? 'Active' : 'Inactive'"
                >
                </span>
              </div>
              <div class="d-flex flex-wrap gap-2">
                <a class="btn btn-primary"
                  th:href="@{/sections/new/{id}(id=${menu.id})}">
                  <i class="bi bi-collection me-1"></i>
                  New Section
                </a>
                <a class="btn btn-outline-primary"
                  th:href="@{/products/new/{id}(id=${menu.id})}">
                  <i class="bi bi-plus-lg me-1"></i>
                  New Product
                </a>
              </div>
            </div>
          </div>

          <div id="sectionsContainer" class="row g-4">
            <div class="col-12 col-lg-6" th:each="section : ${menu.sections}">
              <div class="card section-card h-100">
                <div class="card-header d-flex flex-wrap justify-content-between align-items-center gap-2">
                  <div>
                    <h2 class="h5 fw-bold mb-0" th:text="${section.name}">
                    </h2>
                    <small class="text-muted"
                      th:text="${section.description}">
                    </small>
                  </div>
                  <button class="btn btn-sm btn-outline-primary"
                    data-bs-toggle="modal" data-bs-target="#productModal">
                    <i class="bi bi-plus-lg me-1"></i> Producto
                  </button>
                </div>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item d-flex justify-content-between align-items-start gap-3"
                      th:each="product : ${section.products}">
                      <div>
                        <div class="fw-medium" th:text="${product.name}"></div>
                        <small class="text-muted" th:text="${product.description}">
                        </small>
                      </div>
                      <span class="fw-semibold text-nowrap" th:text="${product.price}">
                      </span>
                    </li>
                    <li class="list-group-item text-muted"
                      th:if="${#lists.isEmpty(section.products)}">
                      Not products yet.
                    </li>
                </ul>
              </div>
            </div>
          </div>
        </div>
    </body>
</html>
