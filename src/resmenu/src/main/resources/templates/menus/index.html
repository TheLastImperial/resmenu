<html layout:decorate="~{layout/main}">
    <head>
    </head>
    <body>
        <div layout:fragment="content">
            <table class="table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th></th>
                        <th></th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="menu : ${menus}">
                        <td th:text="${menu.name}"></td>
                        <td>
                            <a th:href="@{/menus/show/{id}(id=${menu.id})}" class="btn btn-primary">
                                <span class="bi bi-eye"></span>
                                Show
                            </a>
                        </td>
                        <td>
                            <a th:href="@{/menus/edit/{id}(id=${menu.id})}" class="btn btn-warning">
                                <span class="bi bi-pencil-square"></span>
                                Edit
                            </a>
                        </td>
                        <td>
                            <a th:href="@{/menus/delete/{id}(id=${menu.id})}"
                                class="btn btn-danger">
                                <span class="bi bi-trash3"></span>
                                Delete
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
            <div>
                <a th:href="@{/menus/new}" class="btn btn-primary">
                    New Menu
                </a>
            </div>
        </div>
    </body>
</html>
