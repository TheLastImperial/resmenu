<html layout:decorate="~{layout/main}">
    <head>
      <link rel="stylesheet" th:href="@{/css/cruds.css}">
    </head>
    <body>
        <div layout:fragment="content">
          <div class="row justify-content-center">
            <div class="col-12 col-lg-8 col-xl-6">
              <div class="mb-4">
                <a href="/menus" class="text-decoration-none text-muted">
                  <i class="bi bi-arrow-left me-1"></i> Back to menus
                </a>
                <h1 class="h3 fw-bold mt-2">Create new menu</h1>
                <p class="text-muted mb-0">
                  Complete the data to register a new menu.
                </p>
              </div>

              <div class="form-container">
                <form id="createMenuForm" novalidate
                  th:action="@{/menus/create}"
                  th:object="${newMenuRq}"
                  method="post"
                  >
                  <div class="mb-3">
                    <label for="menuName" class="form-label">
                      Name
                    </label>
                    <input
                      type="text"
                      class="form-control"
                      required
                      maxlength="100"
                      th:field="*{name}">
                  </div>
                  <div class="mb-3">
                    <label for="menuDescription" class="form-label">
                      Description
                    </label>
                    <input
                      type="text"
                      class="form-control"
                      required
                      maxlength="100"
                      th:field="*{description}">
                  </div>
                  <div class="mb-3">
                    <label for="address" class="form-label">Address</label>
                    <input
                      type="text"
                      class="form-control"
                      required
                      maxlength="100"
                      th:field="*{address}">
                  </div>
                  <div class="mb-3">
                    <label for="phone" class="form-label">Phone</label>
                    <input
                      type="text"
                      class="form-control"
                      required
                      maxlength="12"
                      th:field="*{phone}"
                      th:classappend="${#fields.hasErrors('phone') ? 'is-invalid' : ''}">
                    <div class="invalid-feedback"
                      th:if="${#fields.hasErrors('phone')}">
                      Max length 12.
                    </div>
                  </div>
                  <div class="d-flex flex-wrap gap-2 justify-content-end">
                    <a href="/menus" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">
                      <i class="bi bi-plus-lg me-1"></i> Save
                    </button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
    </body>
</html>
