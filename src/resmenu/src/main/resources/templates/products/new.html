<html layout:decorate="~{layout/main}">
    <head>
    </head>
    <body>
        <div layout:fragment="content">
            <form 
                action="#"
                th:object="${newProductRq}"
                th:action="@{/products/create}"
                method="post"
                enctype="multipart/form-data">
                <div>
                    <label for="name" class="form-label">Name</label>
                    <input type="text" th:field="*{name}" name="name" class="form-control">
                </div>
                <div>
                    <label for="description" class="form-label">Description</label>
                    <input type="text" th:field="*{description}" name="description" class="form-control">
                    <input type="hidden" th:field="*{menuId}">
                </div>
                <div>
                    <select name="sectionId" class="form-select">
                        <option value="">Select</option>
                        <option 
                            th:each="section : ${sections}"
                            th:value="${section.id}"
                            th:text="${section.name}">
                        </option>
                    </select>
                </div>
                <div>
                    <label for="price" class="form-label">Price</label>
                    <input type="number" th:field="*{price}" class="form-control">
                </div>
                <div>
                    <label for="image" class="form-label">Image</label>
                    <input type="file" th:field="*{image}" class="form-control">
                </div>
                <div class="mt-1">
                    <button type="submit" class="btn btn-primary">
                        Save
                    </button>
                </div>
            </form>
        </div>
    </body>
</html>
