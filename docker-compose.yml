services:
  db:
    image: postgres:18-alpine
    command: postgres -c 'max_connections=300'
    container_name: db
    restart: always
    environment:
      TZ: America/Mazatlan
      LANG: en_US.utf8
      LC_ALL: en_US.utf8
      JDK_JAVA_OPTIONS: '-Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8'
      POSTGRES_DB: resmenu
      POSTGRES_USER: resmenu
      POSTGRES_PASSWORD: 12345678
    ports:
      - 5432:5432
    volumes:
      - ./db:/docker-entrypoint-initdb.d
  grafanadb:
    image: postgres:18-alpine
    container_name: grafanadb
    environment:
      - POSTGRES_DB=grafana
      - POSTGRES_USER=grafana
      - POSTGRES_PASSWORD=12345678
    volumes:
      - ./src/grafana/data:/var/lib/postgresql/18
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grafana -d grafana"]
      interval: 5s
      timeout: 5s
      retries: 5
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - 9090:9090
    volumes:
      - ./src/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./src/prometheus/data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
  pushgateway:
    image: prom/pushgateway:v1.11.3
    command:
      - --persistence.interval=1h
    ports: 
      - "9091:9091"
  grafana:
    image: grafana/grafana:11.6.16
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      grafanadb:
        condition: service_healthy
    environment:
      - GF_DATABASE_URL=postgres://grafana:12345678@grafanadb:5432/grafana
  loki:
    image: grafana/loki
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./src/grafana/loki:/loki
