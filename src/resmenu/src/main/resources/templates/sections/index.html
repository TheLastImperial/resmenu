<html layout:decorate="~{layout/cruds}">
    <body>
        <div layout:fragment="content">

          <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
            <div>
              <h1 class="h3 fw-bold mb-0">Section administration</h1>
              <p class="text-muted mb-0">
                Admnistrate all your sections of <strong th:text="${menu.name}"></strong>
              </p>
            </div>
            <a
              class="btn btn-primary"
              th:href="@{/sections/new/{menuId}(menuId=${menuId})}"
            >
              <i class="bi bi-plus-lg me-1"></i> New section
            </a>
          </div>

          <div class="table-container">
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                  <tr>
                    <th>Name</th>
                    <th>Description</th>
                    <th class="text-end">Actions</th>
                  </tr>
                </thead>
                <tbody>
                  <tr th:each="section : ${sections}">
                    <td th:text="${section.name}"></td>
                    <td th:text="${section.description}"></td>
                    <td class="text-end">
                      <a class="btn btn-sm btn-outline-info action-btn me-1"
                        th:href="@{/sections/show/{menuId}/{id}(id=${section.id},menuId=${menuId})}"
                        title="Show">
                        <i class="bi bi-eye"></i>
                      </a>
                      <a class="btn btn-sm btn-outline-primary action-btn me-1"
                        title="Edit"
                        th:href="@{/sections/edit/{menuId}/{id}(id=${section.id},menuId=${menuId})}">
                        <i class="bi bi-pencil"></i>
                      </a>
                      <button class="btn btn-sm btn-outline-danger action-btn"
                        title="Delete" onclick="openDelete(this)"
                        th:attr="sect-name=${section.name}, sect-id=${section.id},menu-id=${menuId}">
                        <i class="bi bi-trash"></i>
                      </button>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>

            <!-- PAGINATION -->
            <div class="d-flex flex-wrap justify-content-between align-items-center mt-3 gap-2">
              <span id="paginationInfo" class="text-muted small"
                th:text="'Showing ' + ${pageSize} + ' of ' + ${totalElements} + ' menus'">
              </span>
              <nav aria-label="Paginación de menús">
                <ul class="pagination pagination-sm mb-0" id="pagination">
                  <li
                    class="page-item"
                    th:classappend="${currentPage} == 0 ? 'disabled' : ''">
                    <a class="page-link" href="#" th:if="${currentPage} == 0">
                      Previus
                    </a>
                    <a class="page-link" th:href="@{/menus?page={page}(page=${currentPage})}"
                      th:if="${currentPage} != 0">
                      Previus
                    </a>
                  </li>
                  <li class="page-item">
                    <a class="page-link" th:text="${currentPage} + 1">
                    </a>
                  </li>
                  <li class="page-item"
                    th:classappend="${currentPage} + 1 == ${totalPages} ? 'disabled' : ''">
                    <a class="page-link" href="#"
                      th:if="${currentPage} + 1 == ${totalPages}">
                      Next
                    </a>
                    <a class="page-link" th:href="@{/menus?page={page}(page=${currentPage} + 2)}"
                      th:if="${currentPage} + 1 != ${totalPages}" >
                      Next
                    </a>
                  </li>
                </ul>
              </nav>
            </div>
          </div>

          <!-- Modal Eliminar -->
          <div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-sm">
              <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                  <h5 class="modal-title">
                    Delete section
                  </h5>
                  <button type="button" class="btn-close btn-close-white"
                    data-bs-dismiss="modal" aria-label="Cerrar">
                  </button>
                </div>
                <div class="modal-body">
                  <p class="mb-0">
                    You realy want to delete the menu <strong id="deleteName"></strong>?
                  </p>
                </div>
                <div class="modal-footer">
                  <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    Cancel
                  </button>
                  <a type="button" class="btn btn-danger" id="linkDelete">
                    Delete
                  </a>
                </div>
              </div>
            </div>
          </div>
          <script>
            function openDelete(ele) {
              const eleName = document.getElementById('deleteName');
              const eleDelete = document.getElementById('linkDelete');
              
              eleName.textContent = ele.getAttribute('sect-name');
              const sectionId = ele.getAttribute('sect-id');
              const menuId = ele.getAttribute('menu-id');
              const urlDelete = `/sections/delete/${menuId}/${sectionId}`;
              eleDelete.setAttribute('href', urlDelete)
              const deleteModal = new bootstrap.Modal(document.getElementById('deleteModal'));
              deleteModal.show();
            }
          </script>

        </div>
    </body>
</html>
