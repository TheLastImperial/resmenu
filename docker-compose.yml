services:
  db:
    image: postgres:18-alpine
    container_name: db
    environment:
      - POSTGRES_DB=resmenu
      - POSTGRES_USER=resmenu
      - POSTGRES_PASSWORD=12345678
    ports:
      - 5432:5432
    volumes:
      - ./db:/docker-entrypoint-initdb.d
