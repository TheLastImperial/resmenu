<html layout:decorate="~{layout/main}">
    <head>
    </head>
    <body>
        <div layout:fragment="content">
            <div class="row">
                <h3>Sections</h3>
                <span>
                    <span class="fw-bold">Menu:</span>
                    <span th:text="${menu.name}"></span>
                </span>
                
            </div>
            <div>
                <a th:href="@{/sections/new/{menuId}(menuId=${menu.id})}" class="btn btn-primary">
                    <span class="bi bi-plus-circle"></span>
                    <span class="bi bi-chevron-bar-expand"></span>
                    Add section
                </a>
            </div>
            <table class="table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th></th>
                        <th></th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="section : ${sections}">
                        <td th:text="${section.name}"></td>
                        <td>
                            <a th:href="@{/sections/show/{menuId}/{id}(menuId=${menuId},id=${section.id})}"
                                class="btn btn-primary">
                                <span class="bi bi-eye"></span>
                                Show
                            </a>
                        </td>
                        <td>
                            <a th:href="@{/sections/edit/{menuId}/{id}(menuId=${menuId},id=${section.id})}"
                                class="btn btn-warning">
                                <span class="bi bi-pencil-square"></span>
                                Edit
                            </a>
                        </td>
                        <td>
                            <a th:href="@{/sections/delete/{menuId}/{id}(menuId=${menuId},id=${section.id})}"
                                class="btn btn-danger">
                                <span class="bi bi-trash3"></span>
                                Delete
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </body>
</html>
